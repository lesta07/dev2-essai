<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Envoi Photo</title>
</head>
<body>
    <h1>Envoyer une photo au serveur</h1>
    <input type="file" id="fileInput">
    <button onclick="envoyerPhoto()">Envoyer la photo</button>
    <p id="resultat"></p>

    <script>
        function envoyerPhoto() {
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return alert("Choisissez une photo !");

            const formData = new FormData();
            formData.append("maPhoto", fileInput.files[0]);

            document.getElementById('resultat').innerText = "Envoi en cours...";

            fetch("/api/upload-photo", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById('resultat').innerText = "Succès : " + data.message;
            })
            .catch(error => {
                document.getElementById('resultat').innerText = "Erreur d'envoi.";
            });
        }
    </script>
</body>
</html>
