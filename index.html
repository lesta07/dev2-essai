<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Test Photo</title>
</head>
<body>

    <h1>Envoyer une photo à mon serveur</h1>

    <!-- 1. Un champ pour choisir une photo sur votre PC -->
    <input type="file" id="fileInput">
    
    <!-- 2. Un bouton pour lancer l'envoi -->
    <button onclick="envoyerPhoto()">Envoyer au serveur</button>

    <!-- 3. Le code JavaScript -->
    <script>
        function envoyerPhoto() {
            const fileInput = document.getElementById('fileInput');

            // Vérifie si une photo a bien été sélectionnée
            if (fileInput.files.length === 0) {
                alert("Veuillez d'abord choisir une photo !");
                return;
            }

            const formData = new FormData();
            // On ajoute la photo sélectionnée dans le "FormData"
            formData.append("maPhoto", fileInput.files[0]); 

            // On l'envoie vers votre serveur Render
            fetch("https://dev2-essai.onrender.com/api/upload-photo", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                console.log("Réponse du serveur :", data);
                alert("Photo envoyée avec succès !");
            })
            .catch(error => {
                console.error("Erreur:", error);
                alert("Erreur lors de l'envoi.");
            });
        }
    </script>

</body>
</html>
