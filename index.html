<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev2 - Messenger & Upload</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 20px auto; padding: 0 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        #chat-box { height: 200px; border: 1px solid #ddd; border-radius: 4px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #fafafa; }
        .message { margin-bottom: 8px; padding: 6px 10px; border-radius: 4px; background: #e1ffc7; width: fit-content; }
        .chat-input-area { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 8px 15px; background: #0084ff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #006dd3; }
    </style>
</head>
<body>

    <h1>Mon Application Dev2</h1>

    <!-- Section Messenger -->
    <div class="card">
        <h3>Messenger en direct</h3>
        <div id="chat-box"></div>
        <div class="chat-input-area">
            <input type="text" id="usernameInput" placeholder="Votre pseudo" style="max-width: 120px;" />
            <input type="text" id="messageInput" placeholder="Écrivez votre message..." />
            <button onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <!-- Script Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const chatBox = document.getElementById('chat-box');
        const messageInput = document.getElementById('messageInput');
        const usernameInput = document.getElementById('usernameInput');

        function envoyerMessage() {
            const message = messageInput.value.trim();
            const username = usernameInput.value.trim() || "Anonyme";

            if (message !== "") {
                socket.emit('chat-message', { user: username, text: message });
                messageInput.value = '';
            }
        }

        messageInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                envoyerMessage();
            }
        });

        socket.on('chat-message', (data) => {
            const div = document.createElement('div');
            div.classList.add('message');
            div.innerHTML = `<strong>${data.user}:</strong> ${data.text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    </script>

</body>
</html>
