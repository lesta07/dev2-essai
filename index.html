<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Mon Hub Dev2</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #111; color: #fff; }
        #overlay { display: none; margin-top: 20px; padding: 20px; background: #222; border: 1px solid #444; border-radius: 10px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Sécurité Dev2</h1>
    <button id="authBtn">Se connecter (Empreinte)</button>

    <div id="overlay">
        <h2>Bienvenue dans ton Hub !</h2>
        <p>Accès autorisé par ton serveur.</p>
        <!-- Ici tu pourras mettre tes liens Gmail, Messenger, etc. -->
    </div>

    <script>
        document.getElementById('authBtn').addEventListener('click', async () => {
            try {
                // On appelle ton serveur Dev2 sur Render
                const reponse = await fetch('https://NOM-DE-TON-PROJET.onrender.com/api/verifier', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: "connexion" })
                });
                
                const resultat = await reponse.json();
                if(resultat.success) {
                    document.getElementById('overlay').style.display = 'block';
                    alert('Accès validé par le serveur !');
                }
            } catch (e) {
                alert('Erreur de connexion avec le serveur dev2.');
            }
        });
    </script>
</body>
</html>
